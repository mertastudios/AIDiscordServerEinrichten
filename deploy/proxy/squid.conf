# ─────────────────────────────────────────────────────────────────────────────
#  Squid — minimaler, authentifizierter HTTP-Proxy NUR für Discord
#
#  · Basic-Auth (Benutzer/Passwort aus /etc/squid/passwd, erzeugt von entrypoint.sh)
#  · Nur CONNECT auf Port 443 zu discord.com / discord.gg / discordapp.com
#    (REST + Gateway-WebSocket). Alles andere wird abgelehnt — der Proxy ist
#    kein offenes Relay, selbst wenn das Passwort leakt.
#  · Kein Caching, kein Logging von Inhalten (nur Zugriffsprotokoll).
# ─────────────────────────────────────────────────────────────────────────────

http_port 3128

# ── Authentifizierung ────────────────────────────────────────────────────────
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm adse-relay
auth_param basic credentialsttl 2 hours
auth_param basic casesensitive on
acl authenticated proxy_auth REQUIRED

# ── Ziel-Whitelist ───────────────────────────────────────────────────────────
acl discord_hosts dstdomain .discord.com .discord.gg .discordapp.com .discordapp.net .discord.media
acl SSL_ports port 443
acl CONNECT method CONNECT

# Zusätzlich erlaubt: IP-Ermittlung für die Diagnose (GET /api/diagnostics)
acl ip_hosts dstdomain api.ipify.org ifconfig.me checkip.amazonaws.com icanhazip.com www.cloudflare.com
acl Safe_ports port 80 443

# ── Regeln (Reihenfolge zählt) ───────────────────────────────────────────────
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny !authenticated
http_access allow authenticated CONNECT discord_hosts
http_access allow authenticated discord_hosts
http_access allow authenticated ip_hosts
http_access deny all

# ── Kein Cache, schlanke Logs ────────────────────────────────────────────────
cache deny all
cache_mem 8 MB
access_log stdio:/dev/stdout squid
cache_log /dev/null
cache_store_log none
pid_filename /run/squid.pid

# Proxy-Identität nicht nach außen tragen
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all

# Verbindungen lange halten (Gateway-WebSocket läuft über CONNECT)
read_timeout 1 hours
request_timeout 1 minutes
client_lifetime 7 days
half_closed_clients off
shutdown_lifetime 3 seconds
